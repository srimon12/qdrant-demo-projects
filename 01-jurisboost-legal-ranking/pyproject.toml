[project]
name = "jurisboost"
version = "0.1.0"
description = "JurisBoost - Qdrant 1.19 legal precedent retrieval (hybrid RRF, ColBERT, FormulaQuery)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.19",
    "duckdb",
    "fastembed>=0.8.0",
    "numpy",
    "pandas",
    "pyarrow",
    "rich",
]

[project.optional-dependencies]
gpu = [
    "fastembed-gpu>=0.8.0",
    "onnxruntime-gpu==1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
