services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: jurisboost-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      # image has bash but no curl/wget
      test:
        - CMD-SHELL
        - 'bash -c "exec 3<>/dev/tcp/127.0.0.1/6333 && printf ''GET /readyz HTTP/1.1\r\nHost: localhost\r\n\r\n'' >&3 && grep -qi ready <&3"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
