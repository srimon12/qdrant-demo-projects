[project]
name = "geosmart-spatial-hospitality"
version = "2.0.0"
description = "GeoSmart - Qdrant 1.19 ladder: hybrid BM25 DBSF, multi-decay GeoDistance, viewport facets, polygon, grouping"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.19",
    "duckdb>=1.5",
    "fastembed>=0.8",
    "rich",
    "pandas",
    "pyarrow",
    "fastapi>=0.141.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
gpu = [
    "fastembed-gpu>=0.8",
    "onnxruntime-gpu==1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
