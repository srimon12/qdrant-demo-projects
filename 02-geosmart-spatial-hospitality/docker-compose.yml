services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: geosmart-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__ENABLE_CORS=true
    healthcheck:
      # container ships bash but no curl/wget: raw TCP + /readyz probe
      test:
        - CMD-SHELL
        - 'bash -c "exec 3<>/dev/tcp/127.0.0.1/6333 && printf ''GET /readyz HTTP/1.1\r\nHost: localhost\r\n\r\n'' >&3 && grep -qi ready <&3"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  qdrant_data:
  qdrant_snapshots:
